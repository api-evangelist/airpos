    HTML shell for /openapi.json, /llms.txt, /developers and every /.well-known/* path; backoffice.airpointofsale.com
    302s to a Rails sign-in and 404s /api, /openapi.json and /api-docs; the 284-URL help-center sitemap has no API,
    webhook or developer article (integrations are Shopify/Xero/SumUp/Zettle connectors configured in the product);
    and the GitHub org AirPOS (37 repos) holds only forked Kohana/Rails/Heroku infrastructure libraries with no
    client, spec or SDK. The slug domain airpos.com is an unrelated parking lander.'
