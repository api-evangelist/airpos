aid: airpos
name: AirPOS
description: AirPOS Ltd is a Belfast, Northern Ireland software company that sells AirPOS Pay, a subscription-free
  cloud point-of-sale, integrated card payments, stock control, reporting and e-commerce platform for independent
  retailers in the UK and Ireland. The POS software is free and the company charges a single fee per card transaction
  (advertised at 1.4% + 14p for new businesses, from 0.8% for existing businesses), with the platform hosted on
  Amazon EC2 in Dublin. AirPOS ships an Android POS app and a web backoffice and integrates with Shopify, Xero,
  SumUp and Zettle, but it publishes no public API, SDK, webhook surface or developer program of any kind; its GitHub
  organization holds only forked infrastructure libraries. Surfaced via the API Evangelist secondary-market harvest
  (EquityZen listing), and profiled here as a company with no public API surface.
